name: Temporary ImageMagick parser security fuzz
on:
  push:
    branches:
      - audit-imagemagick-mtv-20261022
    paths:
      - .github/workflows/imagemagick-security-fuzz.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Fetch ImageMagick release
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 7.1.2-34 https://github.com/ImageMagick/ImageMagick.git /tmp/imfuzz
          git -C /tmp/imfuzz rev-parse HEAD
      - name: Build with ASan and UBSan
        run: |
          set -euxo pipefail
          cd /tmp/imfuzz
          ./configure --prefix="$RUNNER_TEMP/imfuzz" --without-perl --without-magick-plus-plus --disable-openmp --with-modules=no CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" CXXFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-fsanitize=address,undefined"
          make -j2
          make install
          "$RUNNER_TEMP/imfuzz/bin/magick" -version
      - name: Fuzz twelve image decoders with size-limited malformed inputs
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:allocator_may_return_null=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        shell: bash
        run: |
          cat > /tmp/fuzz.py <<'PY'
          from pathlib import Path
          import random, subprocess, os, time, json, sys, concurrent.futures
          rng=random.Random(20261022)
          magick=str(Path(os.environ['RUNNER_TEMP'])/'imfuzz/bin/magick')
          d=Path('/tmp/fuzzcases');d.mkdir(exist_ok=True)
          formats=['MTV','PNM','BMP','TGA','PCX','PICT','SGI','SUN','DDS','XPM','XBM','ICO']
          basic=['-limit','memory','32MiB','-limit','map','64MiB','-limit','area','1MP','-limit','time','3']
          seeds={}
          # Some decoders have no writer; skip where no valid seed is produced.
          for fmt in formats:
              p=d/('seed.'+fmt.lower())
              r=subprocess.run([magick,*basic,'-size','3x3','gradient:red-blue',fmt+':'+str(p)],capture_output=True,timeout=7)
              if r.returncode and fmt=='PNM':
                  r=subprocess.run([magick,*basic,'-size','3x3','xc:red','PNM:'+str(p)],capture_output=True,timeout=7)
              if r.returncode==0 and p.exists() and p.stat().st_size<50000:
                  seeds[fmt]=p.read_bytes()
          print('VALID_SEEDS='+json.dumps({k:len(v) for k,v in seeds.items()}),flush=True)
          def try_run(fmt,data,name):
              f=d/(f'case_{name}.{fmt.lower()}')
              f.write_bytes(data)
              cmd=[magick,*basic,fmt+':'+str(f),'info:']
              try:
                  p=subprocess.run(cmd,capture_output=True,timeout=2)
                  msg=p.stderr.decode('utf8','replace')
                  # Negative return codes represent signals; ASan and UBSan report in stderr.
                  hit=(p.returncode<0 or ('ERROR: AddressSanitizer' in msg) or ('runtime error:' in msg) or ('AddressSanitizer:DEADLYSIGNAL' in msg))
                  return dict(hit=hit,returncode=p.returncode,error=msg[-1800:],hex=data[:512].hex(),length=len(data))
              except subprocess.TimeoutExpired:
                  return dict(hit=False,timeout=True)
              finally:
                  f.unlink(missing_ok=True)
          def mutate(seed,i):
              b=bytearray(seed)
              if i%17==0: return (rng.choice([b'0',b'-1',b'2147483648',b'4294967295',b'18446744073709551615',b'99999999999999999999999999'])+b' '+seed[:min(60,len(seed))])
              if i%19==0: return seed[:rng.randrange(len(seed)+1)]
              if i%23==0: return seed+rng.randbytes(rng.randrange(1,128))
              for _ in range(rng.randrange(1,7)):
                  if not b: break
                  op=rng.randrange(5)
                  pos=rng.randrange(len(b))
                  if op==0:b[pos]=rng.randrange(256)
                  elif op==1:b[pos:pos+1]=rng.choice([b'0',b'9',b'\x00',b'\xff',b' '*8,b'\r',b'\n',b'9999999',b'4294967295'])
                  elif op==2:del b[pos:pos+rng.randrange(1,min(40,len(b)-pos)+1)]
                  elif op==3:b[pos:pos]=rng.randbytes(rng.randrange(1,40))
                  else:b[pos:pos+1]=b[pos:pos+1]*rng.randrange(2,30)
              return bytes(b[:30000])
          counts={};hits=[];total=0;start=time.monotonic()
          for fmt,seed in seeds.items():
              check=try_run(fmt,seed,fmt+'_original')
              if check['returncode']!=0:
                  print('SEED_INVALID='+fmt+':'+json.dumps(check),flush=True);continue
              counts[fmt]={'total':0,'sanitizer':0,'timeout':0}
              for i in range(650):
                  v=mutate(seed,i)
                  result=try_run(fmt,v,str(i))
                  total+=1;counts[fmt]['total']+=1
                  if result.get('timeout'):counts[fmt]['timeout']+=1
                  if result.get('hit'):
                      counts[fmt]['sanitizer']+=1
                      if len(hits)<16:
                          hits.append(dict(format=fmt,index=i,**result))
                          print('CANDIDATE='+json.dumps(hits[-1]),flush=True)
                  if time.monotonic()-start>390:break
              print('PROGRESS='+json.dumps({fmt:counts[fmt],'elapsed':int(time.monotonic()-start)}),flush=True)
              if time.monotonic()-start>390:break
          print('FUZZ_SUMMARY='+json.dumps({'total':total,'counts':counts,'hits':hits[:16],'elapsed_sec':round(time.monotonic()-start,2)}),flush=True)
          PY
          python3 /tmp/fuzz.py
